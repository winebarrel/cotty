version: 2
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/cotty
    ldflags:
      - -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    # cotty relies on Unix ptys and sockets, so it does not build for Windows.
    goos:
      - linux
      - darwin
checksum:
  name_template: "checksums.txt"
